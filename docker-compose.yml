services:
  postgres:
    image: postgres:16
    container_name: finaccess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finaccess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finaccess_pgdata:/var/lib/postgresql/data

volumes:
  finaccess_pgdata:
